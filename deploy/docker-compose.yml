# One server: the game + relay, with Caddy in front for HTTPS (free certificates from Let's Encrypt, renewed automatically).
# On the server, in this folder:  DOMAIN=game.example.com docker compose up -d --build
services:
  relay:
    build: ..
    restart: unless-stopped
    environment:
      - PORT=8080
    expose:
      - "8080"
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
