<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Seven Holds - art sheets</title>
<style>body{margin:0;background:#120c06;color:#f0e2b6;font-family:Georgia,serif}canvas{display:block;margin:16px auto;border:3px solid #b98a3a}</style></head>
<body>
<canvas id="units" width="1200" height="420"></canvas>
<canvas id="buildings" width="1200" height="940"></canvas>
<canvas id="houses" width="1200" height="520"></canvas>
<script type="module">
import { loadArt, tinted, ramSprite } from './js/art.js';
import { UNITS, BUILDINGS, HOUSES } from './js/config.js';
await loadArt();
const BSPR = { hall: 'hall', keep: 'keep_blue', cottage: 'cottage', farm: 'farm', mill: 'mill', warehouse: 'warehouse', market: 'market', forge: 'forge', workshop: 'workshop', tavern: 'tavern', academy: 'academy', temple: 'temple', barracks: 'barracks', archery: 'archery', stable: 'stable', tower: 'tower', tent: 'market', foundry: 'forge' };
const wood = (c, title, sub) => {
  const x = c.getContext('2d'); const g = x.createLinearGradient(0, 0, 0, c.height); g.addColorStop(0, '#2b2013'); g.addColorStop(1, '#130d06');
  x.fillStyle = g; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#e2c15e'; x.font = 'bold 28px Georgia'; x.fillText(title, 28, 42); x.fillStyle = '#a8946a'; x.font = 'italic 14px Georgia'; x.fillText(sub, 28, 64);
  return x;
};
const put = (x, c, cx, base, w) => { if (!c) return; const h = (c.height / c.width) * w; x.drawImage(c, cx - w / 2, base - h, w, h); };
const label = (x, text, sub, cx, y) => { x.textAlign = 'center'; x.fillStyle = '#f0e2b6'; x.font = 'bold 15px Georgia'; x.fillText(text, cx, y); x.fillStyle = '#a8946a'; x.font = '12px Georgia'; x.fillText(sub, cx, y + 16); };
{ const c = document.getElementById('units'), x = wood(c, 'Unit roster', 'Cut from the concept boards; cloth trim takes the house colour.');
  const ks = Object.keys(UNITS);
  ks.forEach((k, i) => { const cx = 90 + i * 140, base = 300; const img = k === 'ram' ? ramSprite(0) : k === 'serf' ? tinted('serf_dig1', 0, 'trim') : tinted(k, 0, 'trim'); const hh = k === 'ram' ? 70 : k === 'serf' ? 120 : 190; const w = img ? (img.width / img.height) * hh : 1; put(x, img, cx, base, k === 'ram' ? 130 : w); label(x, UNITS[k].label, `HP ${UNITS[k].hp} · dmg ${UNITS[k].dmg}`, cx, base + 34); });
}
{ const c = document.getElementById('buildings'), x = wood(c, 'Building sheet', 'Hall, keep and fourteen working buildings.');
  Object.keys(BSPR).forEach((k, i) => { const cx = 150 + (i % 4) * 300, base = 230 + ((i / 4) | 0) * 225; put(x, tinted(BSPR[k], 0, 'banner'), cx, base, k === 'keep' ? 230 : 170); label(x, BUILDINGS[k].label, `${BUILDINGS[k].time}s · HP ${BUILDINGS[k].hp}`, cx, base + 26); });
}
{ const c = document.getElementById('houses'), x = wood(c, 'Five houses', 'Banners and trim recolour per house: Calder, Varr, Cael, Thorn, Ash.');
  HOUSES.slice(0, 5).forEach((h, i) => { const cx = 120 + i * 240; put(x, tinted('hall', i, 'banner'), cx, 250, 190); put(x, tinted('footman', i, 'trim'), cx - 80, 340, 60); put(x, tinted('knight', i, 'trim'), cx + 80, 340, 80); put(x, tinted('keep_blue', i, 'banner'), cx, 480, 150); label(x, h.name, h.motto, cx, 380); });
}
</script></body></html>
