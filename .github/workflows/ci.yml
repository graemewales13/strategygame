name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q seven_holds play.py
      - name: Headless smoke
        env:
          SDL_VIDEODRIVER: dummy
        run: python -c "from seven_holds.game import Game; g=Game(1); g.update(0.016); print('ok', len(g.units), len(g.buildings))"
