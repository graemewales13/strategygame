name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test            # syntax check of every module + simulation tests on a small board
      - run: npm run test:big    # full-size board: generation, reachability, speed, save/load
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow numpy
      - run: python3 tools/art-lint.py --self-test   # the lint still catches a pink ground, the key, a magenta rim, a figure 20x too big
      - run: python3 tools/art-lint.py               # every sprite: RGBA, clear corners, no key colour, sized like its kind (T30)
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node tools/stamp.js && git diff --stat   # modules must be stamped (informational)
      - name: Serve and click through every menu
        run: |
          python3 -m http.server 8123 &
          sleep 2
          node tools/boot-test.cjs 1
          node tools/ui-smoke.cjs | tee smoke.txt
          ! grep -q "errors \[$" smoke.txt || true
          grep -q "errors \[\]" smoke.txt
