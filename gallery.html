<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seven Holds - gallery</title>
<style>
  :root { --brass:#b98a3a; --gold:#e2c15e; --ink:#f0e2b6; --dim:#a8946a; }
  body { margin:0; background:#120c06 repeating-linear-gradient(92deg, rgba(255,255,255,.015) 0 2px, rgba(0,0,0,.06) 2px 6px); color:var(--ink); font-family:'Cinzel', Georgia, serif; }
  header { padding:28px 32px 8px; max-width:1280px; margin:0 auto; }
  h1 { margin:0; color:var(--gold); font-size:38px; text-shadow:0 3px 0 #000; }
  header p { color:var(--dim); margin:6px 0 0; font-style:italic; }
  a.back { color:var(--gold); }
  section { max-width:1280px; margin:0 auto; padding:10px 32px 28px; }
  h2 { color:var(--gold); border-bottom:2px solid var(--brass); padding-bottom:6px; font-size:22px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(380px, 1fr)); gap:18px; }
  figure { margin:0; background:#21160a; border:3px solid var(--brass); box-shadow:0 8px 24px #000; }
  figure img { display:block; width:100%; height:auto; cursor:zoom-in; }
  figcaption { padding:8px 12px 10px; font-size:13px; color:var(--dim); line-height:1.45; }
  figcaption b { display:block; color:var(--ink); font-size:15px; margin-bottom:2px; }
  #lb { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; place-items:center; z-index:9; cursor:zoom-out; }
  #lb.on { display:grid; } #lb img { max-width:96vw; max-height:96vh; border:3px solid var(--brass); }
</style>
</head>
<body>
<header>
  <h1>Seven Holds: gallery</h1>
  <p>Target look: Age of Empires II chrome. Dark wood panels, gold type, grass, river, dirt paths. <a class="back" href="index.html">Play the game</a></p>
</header>

<section>
  <h2>Captured from the running game</h2>
  <div class="grid">
    <figure><img src="assets/shot-menu.png" alt=""><figcaption><b>Menu</b>Title, subtitle, buttons, house count 3 / 4 / 5, seed, fog toggle, vale preview and the five house crests.</figcaption></figure>
    <figure><img src="assets/shot-small-start.png" alt=""><figcaption><b>The small start</b>One timber hall, two serfs, a little grain, timber and coin, and a lot of empty meadow under fog.</figcaption></figure>
    <figure><img src="assets/shot-expansion.png" alt=""><figcaption><b>After expansion</b>Keep, farm, mill, barracks, forge, archery range; train and build buttons in the bottom HUD; the minimap shows what the house has explored.</figcaption></figure>
    <figure><img src="assets/shot-village.png" alt=""><figcaption><b>A village selected</b>Name, folk, lord, loyalty and protection. Red bar over the walls is protection, blue is loyalty.</figcaption></figure>
    <figure><img src="assets/shot-campaign.png" alt=""><figcaption><b>Campaign map</b>The whole valley under fog, house discs, villages, mines, timber and berries, with the white camera rectangle. Click to travel.</figcaption></figure>
    <figure><img src="assets/shot-victory.png" alt=""><figcaption><b>Victory</b>Last house standing, or hold 65% of the villages for 45 seconds.</figcaption></figure>
  </div>
</section>

<section>
  <h2>Art sheets (drawn by the game's own renderer)</h2>
  <div class="grid">
    <figure><img src="assets/sheet-units.png" alt=""><figcaption><b>Unit roster</b>Serf, scout, footman, bowman, knight, spy, scholar, ram.</figcaption></figure>
    <figure><img src="assets/sheet-buildings.png" alt=""><figcaption><b>Building sheet</b>Hall, keep and fourteen working buildings with cost, time, HP and sight.</figcaption></figure>
    <figure><img src="assets/sheet-villages.png" alt=""><figcaption><b>Six village kinds</b>Hamlet, mining camp, market town, hillfort, abbey, crossroads inn.</figcaption></figure>
    <figure><img src="assets/sheet-houses.png" alt=""><figcaption><b>Five houses</b>Calder (yellow), Varr (red), Cael (blue), Thorn (green), Ash (violet).</figcaption></figure>
  </div>
</section>

<section>
  <h2>Concept boards (early layout studies)</h2>
  <div class="grid">
    <figure><img src="assets/09-main-menu.jpg" alt=""><figcaption><b>Menu concept</b></figcaption></figure>
    <figure><img src="assets/08-small-start.jpg" alt=""><figcaption><b>Small start concept</b></figcaption></figure>
    <figure><img src="assets/01-player-view.jpg" alt=""><figcaption><b>Player field after expansion concept</b></figcaption></figure>
    <figure><img src="assets/02-campaign-map.jpg" alt=""><figcaption><b>Campaign map concept</b></figcaption></figure>
    <figure><img src="assets/07-wide-campaign.jpg" alt=""><figcaption><b>Wide campaign map concept</b></figcaption></figure>
    <figure><img src="assets/10-map-view.jpg" alt=""><figcaption><b>Map view concept</b></figcaption></figure>
    <figure><img src="assets/03-unit-roster.jpg" alt=""><figcaption><b>Unit roster concept</b></figcaption></figure>
    <figure><img src="assets/04-building-sheet.jpg" alt=""><figcaption><b>Building sheet concept</b></figcaption></figure>
    <figure><img src="assets/05-terrain-resources.jpg" alt=""><figcaption><b>Terrain and resources concept</b></figcaption></figure>
    <figure><img src="assets/06-five-houses.jpg" alt=""><figcaption><b>Five houses concept</b></figcaption></figure>
  </div>
</section>
<div id="lb"><img alt=""></div>
<script>
  const lb = document.getElementById('lb'), lbi = lb.querySelector('img');
  document.querySelectorAll('figure img').forEach((i) => i.addEventListener('click', () => { lbi.src = i.src; lb.classList.add('on'); }));
  lb.addEventListener('click', () => lb.classList.remove('on'));
</script>
</body></html>
